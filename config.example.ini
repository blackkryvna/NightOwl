[honeypot]
# TCP port to listen on. Must be > 1024 (no root needed).
# Redirect from 22/23 via nftables externally if needed.
port=2222
# Max simultaneous TCP sessions (extra ones get a polite refusal).
max_sessions=50
# Idle seconds per connection before "Timed out." + disconnect.
session_timeout_sec=60
# Max bytes per login/password line (longer lines disconnect the client).
max_line_length=256

[database]
host=127.0.0.1
port=5432
name=honeyden
user=honeyden
password=CHANGE_ME

[geoip]
# Path to GeoLite2-City.mmdb. If file is missing, app works with empty country/city.
path=GeoLite2-City.mmdb
